services:
    beszel:
        container_name: beszel
        image: henrygd/beszel:latest
        restart: unless-stopped
        ports:
            - 8811:8090
        volumes:
            - ./beszel_data:/beszel_data
            - ./beszel_socket:/beszel_socket
        environment:
            APP_URL: http://10.212.244.230:8811
        healthcheck:
          test: ['CMD', '/beszel', 'health', '--url', 'http://10.212.244.230:8811']
          interval: 120s
          start_period: 10s
          timeout: 5s

    beszel-agent:
        container_name: beszel-agent
        image: henrygd/beszel-agent:latest
        restart: unless-stopped
        volumes:
            - ./beszel_agent_data:/var/lib/beszel-agent
            - ./beszel_socket:/beszel_socket
            - /var/run/docker.sock:/var/run/docker.sock:ro
            ## monitor other disks / partitions by mounting a folder in /extra-filesystems
            # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
        environment:
            LISTEN: /beszel_socket/beszel.sock
            HUB_URL: http://10.212.244.230:8811
            TOKEN: 0958d612-824d-4bcd-89c9-66b148c53e1a
            KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN4x+PB5CQaNsevUr2h4WpbHmnarNtAR6SlCnOohbLmS'
        network_mode: host
        healthcheck:
          test: ['CMD', '/agent', 'health']
          interval: 120s
