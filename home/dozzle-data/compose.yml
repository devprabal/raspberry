services:
    dozzle:
        container_name: dozzle
        image: amir20/dozzle:latest
        restart: unless-stopped
        ports:
            - 8611:8080
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - dozzle_data:/data
        environment:
          DOZZLE_ENABLE_ACTIONS: true

volumes:
    dozzle_data:
